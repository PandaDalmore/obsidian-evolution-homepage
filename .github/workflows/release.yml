name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build
        id: build
        run: |
          npm install
          npm run build
          mkdir dist
          cp main.js manifest.json styles.css dist
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.build.outputs.tag_name }}
          body: "Release ${{ steps.build.outputs.tag_name }} of Evolution homepage. See commit history for details."
          draft: false
          prerelease: false
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
